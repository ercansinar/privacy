<style>
html,body{margin:0;height:100%;background:#222;font-family:Roboto,system-ui,sans-serif;overflow:hidden}
#wrap{position:absolute;left:0;top:0;transform-origin:0 0}
#phone{position:relative;width:360px;height:640px;background:#F7F1E8;overflow:hidden}
#status{height:24px;background:#3E2A1C;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-sizing:border-box}

#map{position:absolute;inset:0}
#nav{position:absolute;left:0;right:0;bottom:0;height:64px;background:#fff;display:flex;border-top:1px solid #eee}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;color:#444;gap:3px}
.tab .ic{width:46px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px}
.tab.sel .ic{background:#F2DED0}
.card{background:rgba(255,255,255,.96);border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#top{position:absolute;left:10px;right:10px;top:10px;padding:8px 12px;z-index:500}
#bottom{position:absolute;left:10px;right:10px;bottom:10px;padding:10px;z-index:500;border-radius:18px}
.row{display:flex;align-items:center}
.lbl{font-size:10px;color:#888;font-weight:600;letter-spacing:.3px}
.chips{display:flex;gap:6px;margin-top:6px;overflow:hidden}
.chip{border:1px solid #E0D6C8;border-radius:10px;padding:4px 9px;text-align:center;background:#fff;flex:none}
.chip.sel{border:2px solid #5D3A1A;background:#FFF4E5}
.chip .d{font-size:11px;font-weight:600}.chip .v{font-size:13px;font-weight:700}
.btn{border-radius:12px;color:#fff;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:12px;text-align:center;font-weight:500;padding:0 4px;box-sizing:border-box}
.ob{border:1px solid #79747E;border-radius:18px;height:36px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#5D3A1A;gap:4px;font-weight:500}
.tb{color:#5D3A1A;font-size:12px;font-weight:500;padding:8px 10px}
.note{font-size:10px;color:#888;line-height:12px}
.fab{position:absolute;right:10px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:500;font-size:18px;color:#5D3A1A}
.pin{width:30px;height:30px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:15px}
.me{width:16px;height:16px;border-radius:50%;background:#1976D2;border:3px solid #fff;box-shadow:0 0 0 6px rgba(25,118,210,.25)}
.screen{position:absolute;inset:0;padding:14px;box-sizing:border-box;overflow:hidden}
.sosbtn{background:#C62828;color:#fff;border-radius:16px;height:76px;display:flex;align-items:center;padding:0 16px;gap:12px}
.field{border:1px solid #79747E;border-radius:4px;height:50px;position:relative;margin-top:6px;display:flex;align-items:center;padding:0 14px;font-size:15px}
.field span{position:absolute;top:-8px;left:10px;background:#F7F1E8;padding:0 4px;font-size:11px;color:#555}
.spot{background:#fff;border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px;margin-top:8px}
.bar{width:60px;height:8px;border-radius:4px;background:#EDE5DA;overflow:hidden}
.leaflet-control-attribution{font-size:8px!important}

<body>
<div id="wrap"><div id="phone">
  <div id="status"><span>11:58</span><span>▲ ◢ ▮ 84%</span></div>
  <div id="content"></div>
  <div id="nav">
    <div class="tab" id="t0"><div class="ic">🗺️</div>Harita</div>
    <div class="tab" id="t1"><div class="ic">🔖</div>Meralarım</div>
    <div class="tab" id="t2"><div class="ic" style="color:#C62828">⚠️</div>Acil Durum</div>
    <div class="tab" id="t3"><div class="ic">⚙️</div>Ayarlar</div>
  </div>
</div></div>
<script>
const S = +(new URLSearchParams(location.search).get('s') || 1);
function fit(){ const k = Math.min(innerHeight/640, innerWidth/360); document.getElementById('wrap').style.transform = `scale(${k})`; }
fit(); addEventListener('resize', fit);
const C = document.getElementById('content');
document.getElementById('t' + ({1:0,2:0,3:2,4:0,5:1}[S])).classList.add('sel');

// ---------- science model (same as the app) ----------
const R = 6378137;
const X = lon => R*lon*Math.PI/180, Y = lat => R*Math.log(Math.tan(Math.PI/4 + lat*Math.PI/360));
const LON = x => x/R*180/Math.PI, LAT = y => (2*Math.atan(Math.exp(y/R)) - Math.PI/2)*180/Math.PI;
const sm = (v,a,b) => { const t = Math.min(1, Math.max(0, (v-a)/(b-a))); return t*t*(3-2*t); };
function climate(d, i){
  const P=d.precipitation_sum, TX=d.temperature_2m_max, TN=d.temperature_2m_min, H=d.relative_humidity_2m_mean, E=d.et0_fao_evapotranspiration;
  let rain=0; for(let k=1;k<=14;k++){ const w = k<=2?0.5:(k<=10?1:0.7); rain += (P[i-k]||0)*w; }
  let ts=0; for(let k=0;k<7;k++) ts += (TX[i-k]+TN[i-k])/2; const tm = ts/7;
  let fr=0; for(let k=0;k<5;k++) if(TN[i-k] < -1) fr++;
  let hs=0; for(let k=0;k<3;k++) hs += H[i-k]; const hum = hs/3;
  let wb=0; for(let k=0;k<=20;k++) wb += (P[i-k]||0) - (E[i-k]||0);
  let hot=0; for(let k=0;k<3;k++) hot = Math.max(hot, TX[i-k]);
  const sT = tm<=3||tm>=28 ? 0 : tm<9 ? sm(tm,3,9) : tm<=20 ? 1 : 1-sm(tm,20,28);
  const moist = 0.5*sm(rain,8,45) + 0.3*sm(wb,-45,15) + 0.2*sm(hum,55,88);
  return Math.min(1, moist * Math.pow(Math.max(0.03,sT),0.7) * Math.max(0,1-0.25*fr) * (hot>32?0.6:1));
}
const stops=[12,30,50,68,85], cols=[[246,215,195],[242,176,112],[232,205,90],[130,190,75],[30,110,45]];
function color(s, a=165){ if(!(s>=12)) return [0,0,0,0]; const v=Math.min(s,85); let i=0; while(i<stops.length-2 && v>stops[i+1]) i++;
  const t=Math.min(1,Math.max(0,(v-stops[i])/(stops[i+1]-stops[i]))); const c1=cols[i], c2=cols[i+1];
  return [c1[0]+(c2[0]-c1[0])*t, c1[1]+(c2[1]-c1[1])*t, c1[2]+(c2[2]-c1[2])*t, a*(0.45+0.55*Math.min(1,s/50))]; }
const classes=[[[0,100,0],1],[[0,207,117],.9],[[255,187,34],.5],[[255,255,76],.35],[[0,150,160],.4],[[250,230,160],.3],[[240,150,255],.12],[[250,0,0],.03],[[180,180,180],.03],[[240,240,240],0],[[0,100,200],NaN]];
function classify(r,g,b,a){ if(a<128) return NaN; let best=null,bd=1e9; for(const [c,v] of classes){ const d=(r-c[0])**2+(g-c[1])**2+(b-c[2])**2; if(d<bd){bd=d;best=v;} } return bd>10800?-2:best; }

async function heat(map, day){
  const b = map.getBounds(); let minX=X(b.getWest()), maxX=X(b.getEast()), minY=Y(b.getSouth()), maxY=Y(b.getNorth());
  const w0=maxX-minX, h0=maxY-minY; minX-=w0*.12; maxX+=w0*.12; minY-=h0*.12; maxY+=h0*.12;
  const asp=(maxY-minY)/(maxX-minX), cols_=8, rows=Math.max(5,Math.min(13,Math.round(cols_*asp)));
  const la=[], lo=[]; for(let r=0;r<rows;r++) for(let c=0;c<cols_;c++){ la.push(LAT(maxY-(maxY-minY)*r/(rows-1)).toFixed(4)); lo.push(LON(minX+(maxX-minX)*c/(cols_-1)).toFixed(4)); }
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&daily=precipitation_sum,temperature_2m_max,temperature_2m_min,relative_humidity_2m_mean,et0_fao_evapotranspiration&past_days=21&forecast_days=7&timezone=auto`;
  const js = await (await fetch(url)).json();
  const arr = Array.isArray(js)?js:[js]; const ti = arr[0].daily.time.length-7;
  const days = []; for(let d=0; d<7; d++) days.push(arr.map(o => climate(o.daily, ti+d)));
  const rw=72, rh=Math.max(36,Math.min(160,Math.round(rw*asp))), sx=3, W=rw*sx, H=rh*sx;
  let hab=null;
  try{
    const img = new Image(); img.crossOrigin='anonymous';
    img.src=`https://mapproxy.terrascope.be/mapproxy/service?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=esa-worldcover-map-10m-2021-v2_map&STYLES=&SRS=EPSG:3857&BBOX=${minX},${minY},${maxX},${maxY}&WIDTH=${W}&HEIGHT=${H}&FORMAT=image/png&TRANSPARENT=TRUE`;
    await img.decode(); const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d'); x.drawImage(img,0,0);
    const px=x.getImageData(0,0,W,H).data; const cls=new Float32Array(W*H); for(let i=0;i<W*H;i++) cls[i]=classify(px[i*4],px[i*4+1],px[i*4+2],px[i*4+3]);
    const out=new Float32Array(rw*rh); for(let y=0;y<rh;y++) for(let xx=0;xx<rw;xx++){ let s=0,n=0,wt=0; for(let dy=0;dy<sx;dy++) for(let dx=0;dx<sx;dx++){ const v=cls[(y*sx+dy)*W+xx*sx+dx]; if(v===-2) continue; if(isNaN(v)) wt++; else {s+=v;n++;} } out[y*rw+xx]=(n==0||wt>n*2)?NaN:s/n; }
    hab=new Float32Array(rw*rh); for(let y=0;y<rh;y++) for(let xx=0;xx<rw;xx++){ const c=out[y*rw+xx]; if(isNaN(c)){hab[y*rw+xx]=NaN;continue;} let s=0,n=0; for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const X2=xx+dx,Y2=y+dy; if(X2<0||Y2<0||X2>=rw||Y2>=rh) continue; const v=out[Y2*rw+X2]; if(!isNaN(v)){s+=v;n++;} } hab[y*rw+xx]=Math.max(c,0.6*c+0.4*s/n); }
  }catch(e){ console.log('wms', e); }
  const rasters = days.map(cl => { const r=new Float32Array(rw*rh); for(let py=0;py<rh;py++) for(let px=0;px<rw;px++){
      const gx=(px+.5)/rw*(cols_-1), gy=(py+.5)/rh*(rows-1); const c0=Math.min(cols_-2,Math.floor(gx)), r0=Math.min(rows-2,Math.floor(gy)); const fx=gx-c0, fy=gy-r0;
      const v=cl[r0*cols_+c0]*(1-fx)*(1-fy)+cl[r0*cols_+c0+1]*fx*(1-fy)+cl[(r0+1)*cols_+c0]*(1-fx)*fy+cl[(r0+1)*cols_+c0+1]*fx*fy;
      const hv = hab ? hab[py*rw+px] : 0.6; r[py*rw+px] = isNaN(hv)?NaN:100*v*(0.2+0.8*hv); } return r; });
  const cv=document.createElement('canvas'); cv.width=rw; cv.height=rh; const ctx=cv.getContext('2d'); const id=ctx.createImageData(rw,rh);
  const r=rasters[day]; for(let i=0;i<r.length;i++){ const c=color(r[i]); id.data.set([c[0],c[1],c[2],c[3]], i*4); } ctx.putImageData(id,0,0);
  L.imageOverlay(cv.toDataURL(), [[LAT(minY),LON(minX)],[LAT(maxY),LON(maxX)]], {className:'heat'}).addTo(map);
  const mean = rr => { let s=0,n=0; for(const v of rr) if(!isNaN(v)){s+=v;n++;} return s/n; };
  // nearest good from a point
  const pt = (px,py) => [LAT(maxY-(maxY-minY)*(py+.5)/rh), LON(minX+(maxX-minX)*(px+.5)/rw)];
  return {means: rasters.map(mean), r, rw, rh, pt, dates: arr[0].daily.time.slice(ti)};
}
const lvl = s => s<20?'Çok düşük':s<40?'Düşük':s<60?'Orta':s<75?'Yüksek':'Çok yüksek';
const rgb = s => { const c=color(s,255); return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`; };
const dayName = (d,i) => i==0?'Bugün':i==1?'Yarın':new Date(d).toLocaleDateString('tr-TR',{weekday:'short'})+' '+(+d.slice(8));
function dist(a,b,c,d){ const p1=a*Math.PI/180,p2=c*Math.PI/180,dp=p2-p1,dl=(d-b)*Math.PI/180; const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2; return 2*6371000*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
const fmt = m => m<1000?Math.round(m)+' m':(m/1000).toFixed(1).replace('.',',')+' km';

async function mapScreen(center, zoom, opts={}){
  C.innerHTML = `<div id="map"></div>
  <div id="top" class="card"><div class="row"><img src="../assets/mantaravcisi/icon512.png" style="width:36px;height:36px;border-radius:9px"><div style="margin-left:10px;flex:1">
  <div class="lbl" id="lbl">BÖLGE UYGUNLUĞU · BUGÜN</div><div class="row" style="align-items:flex-end"><span id="sc" style="font-size:26px;font-weight:700">–</span><span style="font-size:12px;color:#888;margin:0 6px 4px 0">/100</span><span id="lv" style="font-size:14px;font-weight:600;margin-bottom:3px"></span></div></div></div>
  <div class="chips" id="chips"></div></div>
  <div class="fab" style="top:44%">◎</div><div class="fab" style="top:calc(44% + 52px)">↻</div>
  <div id="bottom" class="card">${opts.hit?`<div class="row" style="margin-bottom:6px"><span style="color:#2E6B2A;font-size:18px">★</span><div style="margin-left:6px;flex:1"><div style="font-weight:600;font-size:13px">En yakın uygun yer</div><div style="font-size:12px;color:#888" id="hitt"></div></div><span class="tb">Git</span><span class="tb">Yol tarifi</span></div>`:''}
  <div class="row" style="gap:6px"><div class="btn" style="background:#2E6B2A;flex:1.25">➤<br>Bana en yakın uygun yer</div><div class="btn" style="background:#1565C0;flex:1">🚗<br>${opts.car?'Araca dön':'Aracımı kaydet'}</div><div class="btn" style="background:#5D3A1A;flex:1">📍<br>Burayı mera işaretle</div></div>
  <div class="row" style="margin-top:6px;gap:6px"><div class="ob" style="flex:1">${opts.rec?'■ Kaydı durdur · 2,4 km':'🚶 Yolumu kaydet'}</div>${opts.rec?'<div class="ob" style="padding:0 10px">İzimden geri dön</div>':''}</div>
  <div class="row"><span class="tb">En uygun bölgeler</span><span class="tb">Neden bu puan?</span></div>
  <div class="note">Puan, mantar bulma ihtimali değildir; yalnızca hava ve orman koşullarının uygunluğunu gösterir.</div></div>`;
  const map = L.map('map',{zoomControl:false, attributionControl:true}).setView(center, zoom);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
  const h = await heat(map, 0);
  document.getElementById('sc').textContent = Math.round(h.means[0]); document.getElementById('sc').style.color = rgb(h.means[0]);
  document.getElementById('lv').textContent = lvl(h.means[0]);
  document.getElementById('chips').innerHTML = h.means.map((m,i)=>`<div class="chip ${i==0?'sel':''}"><div class="d">${dayName(h.dates[i],i)}</div><div class="v" style="color:${rgb(m)}">${Math.round(m)}</div></div>`).join('');
  const me = opts.me || center;
  L.marker(me,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);
  const pin = (p,e,c) => L.marker(p,{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${c}">${e}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);
  (opts.spots||[]).forEach(p => pin(p,'🍄','#5D3A1A'));
  if(opts.car) pin(opts.car,'🚗','#1565C0');
  if(opts.track) L.polyline(opts.track,{color:'#7B1FA2',weight:4}).addTo(map);
  if(opts.hit){
    let best=null; for(const th of [65,55,45]){ for(let py=0;py<h.rh;py++) for(let px=0;px<h.rw;px++){ const v=h.r[py*h.rw+px]; if(!(v>=th)) continue; const p=h.pt(px,py); const d=dist(me[0],me[1],p[0],p[1]); if(!best||d<best.d) best={p,d,v}; } if(best) break; }
    if(best){ pin(best.p,'★','#2E7D32'); document.getElementById('hitt').textContent = fmt(best.d)+' · Puan '+Math.round(best.v); L.polyline([me,best.p],{color:'#2E6B2A',dashArray:'6 6',weight:3}).addTo(map); }
  }
  document.title='ready';
}

}

function guideScreen(){
  document.getElementById('nav').style.display='none'; C.style.bottom='0';
  C.innerHTML = `<div class="screen" style="background:#1F3A22;color:#fff;padding:20px;display:flex;flex-direction:column;align-items:center">
  <div class="row" style="width:100%"><span style="font-size:22px;font-weight:700;flex:1">🚗  Aracım</span><span style="font-size:22px">✕</span></div>
  <div style="width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.35);margin-top:30px;display:flex;align-items:center;justify-content:center">
  <svg width="200" height="200" viewBox="0 0 200 200" style="transform:rotate(-38deg)"><path d="M100 0 L164 124 L100 100 L36 124 Z" fill="#FFC107"/></svg></div>
  <div style="font-size:40px;font-weight:700;margin-top:16px">820 m</div>

  <div style="flex:1"></div>
  <div style="width:100%;height:52px;border-radius:26px;background:#FFC107;color:#000;font-weight:700;display:flex;align-items:center;justify-content:center">➦ Yol tarifi</div>
  <div style="width:100%;height:40px;border-radius:20px;border:1px solid #aaa;display:flex;align-items:center;justify-content:center;margin-top:8px">Kapat</div></div>`;
